# forgebench Claude plugin: publish the dev and staging editions.
#
#   develop -> dev edition     (default URL https://api.dev.forgebench.ai)     -> branch plugin-dev
#   staging -> staging edition (default URL https://api.staging.forgebench.ai) -> branch plugin-staging
#   main    -> not handled here: the stable plugin is still published to the marketplace on
#              seedlinglabs/forgebench-cli main by the monorepo's release-forgebench-plugin workflow.
#
# Install an edition beside prod:
#   claude plugin marketplace add seedlinglabs/forgebench-cli@plugin-dev   (then forgebench@forgebench-dev)
#
# The branches are rebuilt from public main on every run (force-pushed), so they carry main's layout plus
# this commit's staged plugin. Publishing requires APP_ID and APP_PRIVATE_KEY secrets for a GitHub App
# installed on seedlinglabs/forgebench-cli with Contents: write.
name: release-edition

on:
  push:
    branches: [develop, staging]

concurrency:
  group: release-edition-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  EDITION: ${{ github.ref_name == 'staging' && 'staging' || 'dev' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install pytest
      - run: python -m pytest tests -q
      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code
      - name: Stage and validate the edition
        run: |
          set -euo pipefail
          STAGE_DIR="$(mktemp -d)"
          python scripts/stage_release.py --edition "$EDITION" --build "$GITHUB_RUN_NUMBER" --destination "$STAGE_DIR"
          claude plugin validate "$STAGE_DIR/plugins/forgebench"
          claude plugin validate "$STAGE_DIR"

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mint a short-lived token for the public repo
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: forgebench-cli
      - name: Check out public repo
        uses: actions/checkout@v4
        with:
          repository: seedlinglabs/forgebench-cli
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: public-repo
      - name: Stage the edition
        run: python scripts/stage_release.py --edition "$EDITION" --build "$GITHUB_RUN_NUMBER" --destination "$RUNNER_TEMP/stage"
      - name: Publish to the edition branch
        run: |
          set -euo pipefail
          cd public-repo
          git checkout -B "plugin-${EDITION}" origin/main
          mkdir -p plugins/forgebench .claude-plugin
          rsync -a --checksum --delete "$RUNNER_TEMP/stage/plugins/forgebench/" plugins/forgebench/
          cp "$RUNNER_TEMP/stage/.claude-plugin/marketplace.json" .claude-plugin/marketplace.json
          git config user.name "forgebench-plugin-bot"
          git config user.email "noreply@forgebench.ai"
          git add -A plugins/forgebench .claude-plugin/marketplace.json
          if git diff --cached --quiet; then
            echo "No plugin changes to publish."
          else
            git commit -m "sync: forgebench Claude plugin ${EDITION} from ${GITHUB_SHA::8}"
            git push --force origin "HEAD:plugin-${EDITION}"
          fi
